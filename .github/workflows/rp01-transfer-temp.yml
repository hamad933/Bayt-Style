name: RP01 Exact Blob Materializer

on:
  push:
    branches:
      - tmp-test-ignore
    paths:
      - .github/workflows/rp01-transfer-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out temporary transfer branch
        uses: actions/checkout@v4
        with:
          ref: tmp-test-ignore
          fetch-depth: 0

      - name: Reconstruct approved locks and exact accepted S03 bytes
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='55f1b2d6c0a6371519f7af7780302cd553b69a7a'
          git fetch origin rp01/real-implementation-s01-s03
          test "$(git rev-parse origin/rp01/real-implementation-s01-s03)" = "$TARGET_SHA"

          cat .rp01-lock-transfer/chunk-* > /tmp/rp01-standard-lockfiles.b64
          base64 --decode /tmp/rp01-standard-lockfiles.b64 > /tmp/rp01-standard-lockfiles.zip
          echo 'c147952a13705978bd7b1cef449774c9fb23a396535a37cd3d0283e538e95455  /tmp/rp01-standard-lockfiles.zip' | sha256sum -c -
          rm -rf /tmp/rp01-locks && mkdir -p /tmp/rp01-locks
          unzip -q /tmp/rp01-standard-lockfiles.zip -d /tmp/rp01-locks
          test "$(git hash-object /tmp/rp01-locks/composer.lock)" = '66df49f1c323b25cccd38552b40882e83edb4270'
          test "$(git hash-object /tmp/rp01-locks/package-lock.json)" = 'a2c6034d8bf184de8cc28508ccb94b124f78a582'

          mkdir -p public/images/products
          curl -L --fail --retry 2 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfMTySq8yBppil-RsjWXSZS-bb0kFhk1RliBwJqNvaC68lMHLyuIMVpdX27rKxauNLiUxJQbVgi1VqbHUaN9RjPrYXayMkZLgGbddttiDMCLoom0S0MehXAmV88IM0F10nWWmQsSevhNgHnSjq4-TOaN89yqK1IMKFi3MvWifhnOOHxAiU3sA=nw?key=OOTkF5H-eHVesVyibUPzHg' -o public/images/products/chair-main.jpg
          curl -L --fail --retry 2 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUdKjbc_Q7pRkvsiuKp9lbkYc5NCImQ8iaCZWQFXiRQnfKBlx0LDGL3-w12GZ3_VC00o-fBOLdB8rPbjVZOOuzddpqGxRpYNASPKwjBaiBC5g2-1wclQBvFwqOm52GOfYQ8eF9PRQfp408t069dUu2LorUbpG5vcPjx4RWeCauyh9SbZozKfog=nw?key=OOTkF5H-eHVesVyibUPzHg' -o public/images/products/chair-detail-side.jpg
          curl -L --fail --retry 2 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf4HBsP6DyJ2yOkJOe667HkIFbHtuP_vjL6zSkFLhXXlqVvWTMjqclLsBP3bPESy1k67WMMwFL4oeGTIiK8ZPIGQW6J7IXbQgNST7DfSkNcVp9Rp_nUKqmQU_FAn_NgIoP3iPGjxjcfD7kxx3urC6400d5WnuaYShb4VGX_JQNlAjSmdvUGrw=nw?key=OOTkF5H-eHVesVyibUPzHg' -o public/images/products/chair-detail-seat.jpg
          curl -L --fail --retry 2 'https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfpLIrXEiZPekZfboKGCvjiwT7hjmm7FVsXKdH34MsYSwG5BIXQ-kuHodlJQKREgbp3eXduKJ8HIFpOCthGKPHj4plIRkdRb895yqeRng3upkv8jhQINpGr32AIM2ujTeXa8VhZFykX-qgbk6Nrzi4bv4_sjYs0VJMNCVGkI3uIbL-iZsJJ6w=nw?key=OOTkF5H-eHVesVyibUPzHg' -o public/images/products/chair-detail-back.jpg

          echo '9b4d59d3b9f9244e1a7f14cad9f7bc58d54dd43b34d980513199d222f0004901  public/images/products/chair-main.jpg' | sha256sum -c -
          echo '139a13fc55e65f7b339e3ca970c6af0931f8e608414818d8887475e68dae506a  public/images/products/chair-detail-side.jpg' | sha256sum -c -
          echo 'ac1923edbd7f1299ed2648136dc7f568338fa985197731e4ddd620dd6c9bcccd  public/images/products/chair-detail-seat.jpg' | sha256sum -c -
          echo 'f32dabf7c717c2921a35519fbbc2e5927365c5cb686ef5cf5b484cffe733e768  public/images/products/chair-detail-back.jpg' | sha256sum -c -
          test "$(git hash-object public/images/products/chair-main.jpg)" = '5a3b627a9f01129672d1038ac53dee1d113fcee4'
          test "$(git hash-object public/images/products/chair-detail-side.jpg)" = '3f12b612ef4bbd75dfa988df68164ceaf01b1243'
          test "$(git hash-object public/images/products/chair-detail-seat.jpg)" = '62caaafb36015f2c84c1e9d1539c2556e645aabc'
          test "$(git hash-object public/images/products/chair-detail-back.jpg)" = 'fe8faf6d724c3964a53c3893c20fbac8ac951d15'

          cp /tmp/rp01-locks/composer.lock composer.lock
          cp /tmp/rp01-locks/package-lock.json package-lock.json

      - name: Persist only the six exact blobs on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object composer.lock)" = '66df49f1c323b25cccd38552b40882e83edb4270'
          test "$(git hash-object package-lock.json)" = 'a2c6034d8bf184de8cc28508ccb94b124f78a582'
          test "$(git hash-object public/images/products/chair-main.jpg)" = '5a3b627a9f01129672d1038ac53dee1d113fcee4'
          test "$(git hash-object public/images/products/chair-detail-side.jpg)" = '3f12b612ef4bbd75dfa988df68164ceaf01b1243'
          test "$(git hash-object public/images/products/chair-detail-seat.jpg)" = '62caaafb36015f2c84c1e9d1539c2556e645aabc'
          test "$(git hash-object public/images/products/chair-detail-back.jpg)" = 'fe8faf6d724c3964a53c3893c20fbac8ac951d15'
          git add composer.lock package-lock.json \
            public/images/products/chair-main.jpg \
            public/images/products/chair-detail-side.jpg \
            public/images/products/chair-detail-seat.jpg \
            public/images/products/chair-detail-back.jpg
          python3 - <<'PY'
          import subprocess
          expected = {
              'composer.lock', 'package-lock.json',
              'public/images/products/chair-main.jpg',
              'public/images/products/chair-detail-side.jpg',
              'public/images/products/chair-detail-seat.jpg',
              'public/images/products/chair-detail-back.jpg',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(actual ^ expected)}')
          PY
          git config user.name 'RP01 bounded executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(transfer): materialize exact RP01 final blobs'
          git push origin HEAD:tmp-test-ignore
