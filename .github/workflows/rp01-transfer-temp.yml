name: RP01 Exact Blob Materializer

on:
  push:
    branches:
      - tmp-test-ignore
    paths:
      - .github/workflows/rp01-transfer-temp.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out temporary transfer branch
        uses: actions/checkout@v4
        with:
          ref: tmp-test-ignore
          fetch-depth: 0

      - name: Reconstruct approved locks and accepted S03 bytes
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA='55f1b2d6c0a6371519f7af7780302cd553b69a7a'
          git fetch origin rp01/real-implementation-s01-s03
          test "$(git rev-parse origin/rp01/real-implementation-s01-s03)" = "$TARGET_SHA"

          cat .rp01-lock-transfer/chunk-* > /tmp/rp01-standard-lockfiles.b64
          base64 --decode /tmp/rp01-standard-lockfiles.b64 > /tmp/rp01-standard-lockfiles.zip
          echo 'c147952a13705978bd7b1cef449774c9fb23a396535a37cd3d0283e538e95455  /tmp/rp01-standard-lockfiles.zip' | sha256sum -c -
          rm -rf /tmp/rp01-locks && mkdir -p /tmp/rp01-locks
          unzip -q /tmp/rp01-standard-lockfiles.zip -d /tmp/rp01-locks
          test "$(git hash-object /tmp/rp01-locks/composer.lock)" = '66df49f1c323b25cccd38552b40882e83edb4270'
          test "$(git hash-object /tmp/rp01-locks/package-lock.json)" = 'a2c6034d8bf184de8cc28508ccb94b124f78a582'

          python3 -m pip install --quiet --user gdown
          python3 -m gdown 'https://drive.google.com/uc?id=1CsvOvnUtqyTnLIqYHm7SWKMueX6iWd8i' -O /tmp/rp01-s03.zip
          echo '2503e263d731bc44ebdb68b704339973245af16b4a7bcd0536b8c8a6a92649cc  /tmp/rp01-s03.zip' | sha256sum -c -
          rm -rf /tmp/rp01-s03 && mkdir -p /tmp/rp01-s03
          unzip -q /tmp/rp01-s03.zip -d /tmp/rp01-s03
          SRC='/tmp/rp01-s03/RP01-S03_Product_Detail/assets'
          echo '9b4d59d3b9f9244e1a7f14cad9f7bc58d54dd43b34d980513199d222f0004901  /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-main.jpg' | sha256sum -c -
          echo '139a13fc55e65f7b339e3ca970c6af0931f8e608414818d8887475e68dae506a  /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-side.jpg' | sha256sum -c -
          echo 'ac1923edbd7f1299ed2648136dc7f568338fa985197731e4ddd620dd6c9bcccd  /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-seat.jpg' | sha256sum -c -
          echo 'f32dabf7c717c2921a35519fbbc2e5927365c5cb686ef5cf5b484cffe733e768  /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-back.jpg' | sha256sum -c -
          test "$(git hash-object "$SRC/chair-main.jpg")" = '5a3b627a9f01129672d1038ac53dee1d113fcee4'
          test "$(git hash-object "$SRC/chair-detail-side.jpg")" = '3f12b612ef4bbd75dfa988df68164ceaf01b1243'
          test "$(git hash-object "$SRC/chair-detail-seat.jpg")" = '62caaafb36015f2c84c1e9d1539c2556e645aabc'
          test "$(git hash-object "$SRC/chair-detail-back.jpg")" = 'fe8faf6d724c3964a53c3893c20fbac8ac951d15'

          cp /tmp/rp01-locks/composer.lock composer.lock
          cp /tmp/rp01-locks/package-lock.json package-lock.json
          mkdir -p public/images/products
          cp "$SRC/chair-main.jpg" public/images/products/chair-main.jpg
          cp "$SRC/chair-detail-side.jpg" public/images/products/chair-detail-side.jpg
          cp "$SRC/chair-detail-seat.jpg" public/images/products/chair-detail-seat.jpg
          cp "$SRC/chair-detail-back.jpg" public/images/products/chair-detail-back.jpg

      - name: Persist only the six exact blobs on temporary branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object composer.lock)" = '66df49f1c323b25cccd38552b40882e83edb4270'
          test "$(git hash-object package-lock.json)" = 'a2c6034d8bf184de8cc28508ccb94b124f78a582'
          test "$(git hash-object public/images/products/chair-main.jpg)" = '5a3b627a9f01129672d1038ac53dee1d113fcee4'
          test "$(git hash-object public/images/products/chair-detail-side.jpg)" = '3f12b612ef4bbd75dfa988df68164ceaf01b1243'
          test "$(git hash-object public/images/products/chair-detail-seat.jpg)" = '62caaafb36015f2c84c1e9d1539c2556e645aabc'
          test "$(git hash-object public/images/products/chair-detail-back.jpg)" = 'fe8faf6d724c3964a53c3893c20fbac8ac951d15'
          git add composer.lock package-lock.json \
            public/images/products/chair-main.jpg \
            public/images/products/chair-detail-side.jpg \
            public/images/products/chair-detail-seat.jpg \
            public/images/products/chair-detail-back.jpg
          python3 - <<'PY'
          import subprocess
          expected = {
              'composer.lock', 'package-lock.json',
              'public/images/products/chair-main.jpg',
              'public/images/products/chair-detail-side.jpg',
              'public/images/products/chair-detail-seat.jpg',
              'public/images/products/chair-detail-back.jpg',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(actual ^ expected)}')
          PY
          git config user.name 'RP01 bounded executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(transfer): materialize exact RP01 final blobs'
          git push origin HEAD:tmp-test-ignore
