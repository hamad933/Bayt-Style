name: RP01 Temporary Write Probe

on:
  push:
    branches:
      - rp01/real-implementation-s01-s03

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove bounded write-back
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rp01-write-probe-temp.yml .rp01-write-probe-trigger
          git add -A .github/workflows/rp01-write-probe-temp.yml .rp01-write-probe-trigger
          git config user.name 'RP01 bounded executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'chore(ci): remove temporary write probe'
          git push origin HEAD:rp01/real-implementation-s01-s03
