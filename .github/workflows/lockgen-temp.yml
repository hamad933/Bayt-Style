name: Temporary Primary Review Correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-bounded-correction:
    name: Generate locks and restore accepted S03 media
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate standard lockfiles from approved manifests
        shell: bash
        run: |
          set -euo pipefail
          composer update --no-install --no-scripts --no-interaction --prefer-dist --no-progress
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -f composer.lock
          test -f package-lock.json
          git diff --exit-code -- composer.json package.json

      - name: Retrieve exact accepted S03 artifact and restore distinct media
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            'https://drive.usercontent.google.com/download?id=1CsvOvnUtqyTnLIqYHm7SWKMueX6iWd8i&export=download&confirm=t' \
            -o /tmp/rp01-s03.zip
          echo '2503e263d731bc44ebdb68b704339973245af16b4a7bcd0536b8c8a6a92649cc  /tmp/rp01-s03.zip' | sha256sum -c -
          rm -rf /tmp/rp01-s03
          mkdir -p /tmp/rp01-s03
          unzip -q /tmp/rp01-s03.zip 'RP01-S03_Product_Detail/assets/*' -d /tmp/rp01-s03
          cp /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-main.jpg public/images/products/chair-main.jpg
          cp /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-side.jpg public/images/products/chair-detail-side.jpg
          cp /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-seat.jpg public/images/products/chair-detail-seat.jpg
          cp /tmp/rp01-s03/RP01-S03_Product_Detail/assets/chair-detail-back.jpg public/images/products/chair-detail-back.jpg
          echo '9b4d59d3b9f9244e1a7f14cad9f7bc58d54dd43b34d980513199d222f0004901  public/images/products/chair-main.jpg' | sha256sum -c -
          echo '139a13fc55e65f7b339e3ca970c6af0931f8e608414818d8887475e68dae506a  public/images/products/chair-detail-side.jpg' | sha256sum -c -
          echo 'ac1923edbd7f1299ed2648136dc7f568338fa985197731e4ddd620dd6c9bcccd  public/images/products/chair-detail-seat.jpg' | sha256sum -c -
          echo 'f32dabf7c717c2921a35519fbbc2e5927365c5cb686ef5cf5b484cffe733e768  public/images/products/chair-detail-back.jpg' | sha256sum -c -
          test "$(git hash-object public/images/products/chair-main.jpg public/images/products/chair-detail-side.jpg public/images/products/chair-detail-seat.jpg public/images/products/chair-detail-back.jpg | sort -u | wc -l)" -eq 4

      - name: Make permanent CI reproducible and verify gallery switching
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/product-ci.yml')
          text = ci.read_text()
          replacements = {
              "      - name: Install PHP dependencies\n        run: composer install --no-interaction --prefer-dist --no-progress\n":
              "      - name: Install PHP dependencies from composer.lock\n        run: |\n          test -f composer.lock\n          composer install --no-interaction --prefer-dist --no-progress\n",
              "      - name: Install frontend dependencies\n        run: npm install --no-audit --no-fund\n":
              "      - name: Install frontend dependencies from package-lock.json\n        run: |\n          test -f package-lock.json\n          npm ci --no-audit --no-fund\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one CI block to replace: {old!r}')
              text = text.replace(old, new)
          if 'npm install --no-audit --no-fund' in text:
              raise SystemExit('normal Product CI still contains npm install')
          ci.write_text(text)

          e2e = Path('tests/e2e/customer-flow.spec.js')
          test_text = e2e.read_text()
          marker = "    await expect(page).toHaveURL(/\\/products\\/olive-velvet-lounge-chair/);\n\n"
          gallery_check = """    const galleryPanels = page.locator('.gallery-main img[role=\"tabpanel\"]');
              await expect(galleryPanels).toHaveCount(4);
              const gallerySources = await galleryPanels.evaluateAll((images) => images.map((image) => new URL(image.src).pathname));
              expect(new Set(gallerySources).size).toBe(4);

              const secondGalleryTab = page.getByRole('tab', { name: 'عرض الصورة 2' });
              await secondGalleryTab.click();
              await expect(secondGalleryTab).toHaveAttribute('aria-selected', 'true');
              await expect(page.locator('#product-media-1')).toBeVisible();
              await expect(page.locator('#product-media-0')).toBeHidden();

              const fourthGalleryTab = page.getByRole('tab', { name: 'عرض الصورة 4' });
              await fourthGalleryTab.click();
              await expect(fourthGalleryTab).toHaveAttribute('aria-selected', 'true');
              await expect(page.locator('#product-media-3')).toBeVisible();
              await expect(page.locator('#product-media-1')).toBeHidden();

          """
          gallery_check = '\n'.join(line[12:] if line.startswith('            ') else line for line in gallery_check.splitlines()) + '\n'
          if test_text.count(marker) != 1:
              raise SystemExit('expected product-detail marker not found exactly once')
          test_text = test_text.replace(marker, marker + gallery_check)
          e2e.write_text(test_text)
          PY

      - name: Verify bounded correction and commit it
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/lockgen-temp.yml
          git diff --exit-code -- composer.json package.json
          test -f composer.lock
          test -f package-lock.json
          grep -F 'composer install --no-interaction --prefer-dist --no-progress' .github/workflows/product-ci.yml
          grep -F 'npm ci --no-audit --no-fund' .github/workflows/product-ci.yml
          ! grep -F 'npm install --no-audit --no-fund' .github/workflows/product-ci.yml
          git add composer.lock package-lock.json .github/workflows/product-ci.yml tests/e2e/customer-flow.spec.js \
            public/images/products/chair-main.jpg \
            public/images/products/chair-detail-side.jpg \
            public/images/products/chair-detail-seat.jpg \
            public/images/products/chair-detail-back.jpg \
            .github/workflows/lockgen-temp.yml
          python3 - <<'PY'
          import subprocess
          expected = {
              'composer.lock',
              'package-lock.json',
              '.github/workflows/product-ci.yml',
              'tests/e2e/customer-flow.spec.js',
              'public/images/products/chair-main.jpg',
              'public/images/products/chair-detail-side.jpg',
              'public/images/products/chair-detail-seat.jpg',
              'public/images/products/chair-detail-back.jpg',
              '.github/workflows/lockgen-temp.yml',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(actual ^ expected)}')
          PY
          git config user.name 'RP01 bounded executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(review): lock dependencies and restore distinct S03 media'
          git push origin "HEAD:${TARGET_BRANCH}"
