name: Governance Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-baseline:
    name: Verify governance-only bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposal
        uses: actions/checkout@v4

      - name: Verify required governance files and markers
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "docs/GOVERNANCE.md"
            "docs/EXECUTION_HANDOFF.md"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/workflows/governance.yml"
          )

          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Required governance file is missing or empty: $path" >&2
              exit 1
            fi
          done

          grep -Fq 'RP01' README.md
          grep -Fq 'RP01-WS-REPO-GOV-BOOTSTRAP' README.md
          grep -Fq 'GOVERNANCE_BOOTSTRAP_READY_FOR_PRIMARY_REVIEW' README.md
          grep -Fq 'No product implementation' AGENTS.md

      - name: Enforce governance-only tracked-path allowlist
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tracked_paths < <(git ls-files)
          unexpected=0

          for path in "${tracked_paths[@]}"; do
            case "$path" in
              README.md|AGENTS.md|CONTRIBUTING.md|docs/GOVERNANCE.md|docs/EXECUTION_HANDOFF.md|.github/CODEOWNERS|.github/pull_request_template.md|.github/workflows/governance.yml)
                ;;
              *)
                echo "Path outside governance bootstrap allowlist: $path" >&2
                unexpected=1
                ;;
            esac
          done

          if [[ "$unexpected" -ne 0 ]]; then
            exit 1
          fi

          printf 'Verified %s governance-only tracked paths.\n' "${#tracked_paths[@]}"
