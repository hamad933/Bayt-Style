name: Governance Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-integrity:
    name: Verify durable governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out proposal
        uses: actions/checkout@v4

      - name: Verify required governance files and durable markers
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "docs/GOVERNANCE.md"
            "docs/EXECUTION_HANDOFF.md"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
            ".github/workflows/governance.yml"
          )

          for path in "${required[@]}"; do
            if [[ ! -s "$path" ]]; then
              echo "Required governance file is missing or empty: $path" >&2
              exit 1
            fi
          done

          grep -Fq 'RP01' README.md
          grep -Fq 'DURABLE_GOVERNANCE_ACTIVE' README.md
          grep -Fq 'AUTHORIZED_WORKSTREAM_REQUIRED' AGENTS.md
          grep -Fq 'NO_SELF_APPROVAL' AGENTS.md
          grep -Fq 'DIRECT_SOURCE_AUTHORITY' docs/GOVERNANCE.md
          grep -Fq 'SEPARATE_RELEASE_AUTHORITY' docs/GOVERNANCE.md
          grep -Fq 'GOVERNANCE_CHANGE' .github/pull_request_template.md
          grep -Fq 'PRODUCT_IMPLEMENTATION' .github/pull_request_template.md

      - name: Reject stale bootstrap-only controls
        shell: bash
        run: |
          set -euo pipefail

          control_files=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "docs/GOVERNANCE.md"
            "docs/EXECUTION_HANDOFF.md"
            ".github/pull_request_template.md"
          )

          stale_patterns=(
            "GOVERNANCE_BOOTSTRAP_READY_FOR_PRIMARY_REVIEW"
            "This repository is in a governance-only bootstrap state"
            "Enforce governance-only tracked-path allowlist"
          )

          for pattern in "${stale_patterns[@]}"; do
            if grep -Fq -- "$pattern" "${control_files[@]}"; then
              echo "Stale bootstrap-only control detected: $pattern" >&2
              exit 1
            fi
          done

      - name: Governance integrity summary
        shell: bash
        run: |
          set -euo pipefail
          echo "Durable RP01 governance markers are present."
          echo "No repository-wide product-path allowlist is enforced by this workflow."
