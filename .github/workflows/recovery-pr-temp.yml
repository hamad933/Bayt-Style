name: RP01 Temporary PR Recovery

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Download exact lockfile artifact
        uses: actions/download-artifact@v4
        with:
          name: rp01-standard-lockfiles
          path: /tmp/rp01-locks
          github-token: ${{ github.token }}
          repository: hamad933/Bayt-Style
          run-id: '31355729607'

      - name: Restore exact lockfiles and accepted gallery bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f /tmp/rp01-locks/composer.lock
          test -f /tmp/rp01-locks/package-lock.json
          cp /tmp/rp01-locks/composer.lock composer.lock
          cp /tmp/rp01-locks/package-lock.json package-lock.json
          git diff --exit-code -- composer.json package.json

          fetch_blob() {
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$1" --jq '.content' | tr -d '\n' | base64 --decode > "$2"
          }
          fetch_blob 09a0ee1cbe7cb87f78a7983f97c663c22e77fbb0 public/images/products/chair-main.jpg
          fetch_blob 1573771895456151073025d008bfb0ad923839e0 public/images/products/chair-detail-side.jpg
          fetch_blob 87cfd4f2bb77cf99eb7bbe1b893a7896fbccae83 public/images/products/chair-detail-seat.jpg
          fetch_blob fc0aebac4aa2da3be0e78ba6e4dfe8263b8ee95f public/images/products/chair-detail-back.jpg

          echo '9b4d59d3b9f9244e1a7f14cad9f7bc58d54dd43b34d980513199d222f0004901  public/images/products/chair-main.jpg' | sha256sum -c -
          echo '139a13fc55e65f7b339e3ca970c6af0931f8e608414818d8887475e68dae506a  public/images/products/chair-detail-side.jpg' | sha256sum -c -
          echo 'ac1923edbd7f1299ed2648136dc7f568338fa985197731e4ddd620dd6c9bcccd  public/images/products/chair-detail-seat.jpg' | sha256sum -c -
          echo 'f32dabf7c717c2921a35519fbbc2e5927365c5cb686ef5cf5b484cffe733e768  public/images/products/chair-detail-back.jpg' | sha256sum -c -
          test "$(git hash-object public/images/products/chair-main.jpg public/images/products/chair-detail-side.jpg public/images/products/chair-detail-seat.jpg public/images/products/chair-detail-back.jpg | sort -u | wc -l)" -eq 4

      - name: Apply permanent bounded correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ci = Path('.github/workflows/product-ci.yml')
          text = ci.read_text()
          old_php = "      - name: Install PHP dependencies\n        run: composer install --no-interaction --prefer-dist --no-progress\n"
          new_php = "      - name: Install PHP dependencies from composer.lock\n        run: |\n          test -f composer.lock\n          composer install --no-interaction --prefer-dist --no-progress\n"
          old_node = "      - name: Install frontend dependencies\n        run: npm install --no-audit --no-fund\n"
          new_node = "      - name: Install frontend dependencies from package-lock.json\n        run: |\n          test -f package-lock.json\n          npm ci --no-audit --no-fund\n"
          if old_php in text:
              text = text.replace(old_php, new_php)
          if old_node in text:
              text = text.replace(old_node, new_node)
          if 'test -f composer.lock' not in text or 'test -f package-lock.json' not in text:
              raise SystemExit('lock checks missing from permanent CI')
          if 'npm ci --no-audit --no-fund' not in text or 'npm install --no-audit --no-fund' in text:
              raise SystemExit('node install is not lock-only')
          ci.write_text(text)

          e2e = Path('tests/e2e/customer-flow.spec.js')
          test_text = e2e.read_text()
          marker = "    await expect(page).toHaveURL(/\\/products\\/olive-velvet-lounge-chair/);\n\n"
          gallery = '''    const galleryPanels = page.locator('.gallery-main img[role="tabpanel"]');
              await expect(galleryPanels).toHaveCount(4);
              const gallerySources = await galleryPanels.evaluateAll((images) => images.map((image) => new URL(image.src).pathname));
              expect(new Set(gallerySources).size).toBe(4);
              await expect(galleryPanels.nth(0)).toHaveAttribute('src', /chair-main\\.jpg$/);
              await expect(galleryPanels.nth(0)).toBeVisible();

              const secondGalleryTab = page.getByRole('tab', { name: 'عرض الصورة 2' });
              await secondGalleryTab.click();
              await expect(secondGalleryTab).toHaveAttribute('aria-selected', 'true');
              await expect(page.locator('#product-media-1')).toBeVisible();
              await expect(page.locator('#product-media-0')).toBeHidden();

              const fourthGalleryTab = page.getByRole('tab', { name: 'عرض الصورة 4' });
              await fourthGalleryTab.click();
              await expect(fourthGalleryTab).toHaveAttribute('aria-selected', 'true');
              await expect(page.locator('#product-media-3')).toBeVisible();
              await expect(page.locator('#product-media-1')).toBeHidden();

          '''
          gallery = '\n'.join(line[12:] if line.startswith('            ') else line for line in gallery.splitlines()) + '\n'
          if 'const galleryPanels' not in test_text:
              if test_text.count(marker) != 1:
                  raise SystemExit('gallery insertion point not found')
              test_text = test_text.replace(marker, marker + gallery)
          e2e.write_text(test_text)
          PY

      - name: Publish final bounded commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/lockgen-temp.yml .github/workflows/recovery-temp.yml .github/workflows/recovery-pr-temp.yml
          git diff --exit-code -- composer.json package.json
          test -f composer.lock
          test -f package-lock.json
          grep -Fq 'test -f composer.lock' .github/workflows/product-ci.yml
          grep -Fq 'composer install --no-interaction --prefer-dist --no-progress' .github/workflows/product-ci.yml
          grep -Fq 'test -f package-lock.json' .github/workflows/product-ci.yml
          grep -Fq 'npm ci --no-audit --no-fund' .github/workflows/product-ci.yml
          ! grep -Fq 'npm install --no-audit --no-fund' .github/workflows/product-ci.yml

          git add -A
          python3 - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/product-ci.yml',
              '.github/workflows/lockgen-temp.yml',
              '.github/workflows/recovery-temp.yml',
              '.github/workflows/recovery-pr-temp.yml',
              'composer.lock', 'package-lock.json',
              'tests/e2e/customer-flow.spec.js',
              'public/images/products/chair-main.jpg',
              'public/images/products/chair-detail-side.jpg',
              'public/images/products/chair-detail-seat.jpg',
              'public/images/products/chair-detail-back.jpg',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          extra = actual - allowed
          if extra:
              raise SystemExit(f'out-of-scope staged paths: {sorted(extra)}')
          required = {
              '.github/workflows/product-ci.yml',
              '.github/workflows/lockgen-temp.yml',
              '.github/workflows/recovery-temp.yml',
              '.github/workflows/recovery-pr-temp.yml',
              'composer.lock', 'package-lock.json',
              'tests/e2e/customer-flow.spec.js',
              'public/images/products/chair-main.jpg',
              'public/images/products/chair-detail-side.jpg',
              'public/images/products/chair-detail-seat.jpg',
              'public/images/products/chair-detail-back.jpg',
          }
          missing = required - actual
          if missing:
              raise SystemExit(f'required paths not staged: {sorted(missing)}')
          PY

          git config user.name 'RP01 bounded executor'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(review): lock dependencies and restore distinct S03 media'
          git push origin HEAD:rp01/real-implementation-s01-s03
